name: Selenium Test CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [smoke, regression, all]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests for profile
        run: mvn -B -ntp -P${{ matrix.profile }} test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.profile }}
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload Extent reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports-${{ matrix.profile }}
          path: target/extent-reports
          if-no-files-found: warn

      - name: Upload framework logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-logs-${{ matrix.profile }}
          path: target/logs
          if-no-files-found: warn
